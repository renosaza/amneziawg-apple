name: macOS single-profile daemon POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: scripts/daemon-control/go.mod
          cache-dependency-path: scripts/daemon-control/go.sum
      - name: Run one synthetic child lifecycle on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          go build -C Sources/WireGuardKitGo -o ../../out/amneziawg-go github.com/amnezia-vpn/amneziawg-go/v3
          sudo install -d -o root -g wheel -m 0755 /usr/local/libexec
          sudo install -o root -g wheel -m 0755 out/amneziawg-go /usr/local/libexec/amneziawg-go-daemon-single-poc
          sudo env AMNEZIAWG_DAEMON_RUNTIME=1 AMNEZIAWG_DAEMON_BINARY=/usr/local/libexec/amneziawg-go-daemon-single-poc go test -C scripts/daemon-control -tags manualruntime -run TestManualSyntheticTunnelLifecycle -count=1
