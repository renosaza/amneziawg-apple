name: macOS daemon-control install POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: scripts/daemon-control/go.mod
          cache-dependency-path: scripts/daemon-control/go.sum
      - name: Inspect fixed runtime and install parents
        shell: bash
        run: |
          set -euo pipefail
          for path in /private /private/var /private/var/run /private/var/root /usr /usr/local /usr/local/libexec /Library /Library/LaunchDaemons; do
            printf '%s\n' "-- $path"
            stat -f 'owner=%u group=%g mode=%Lp type=%HT' "$path"
            ls -ldeO "$path"
          done
      - name: Install, query, and uninstall the synthetic daemon on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          go build -C Sources/WireGuardKitGo -o ../../out/amneziawg-go github.com/amnezia-vpn/amneziawg-go/v3
          go build -C scripts/daemon-control -o ../../out/amneziawg-daemon-control-poc ./cmd/daemon-control-poc
          uid=$(id -u)
          cleanup() {
            sudo "$GITHUB_WORKSPACE/scripts/install-daemon-control-poc.sh" uninstall --uid "$uid" || true
          }
          trap cleanup EXIT
          sudo "$GITHUB_WORKSPACE/scripts/install-daemon-control-poc.sh" install \
            --daemon "$GITHUB_WORKSPACE/out/amneziawg-daemon-control-poc" \
            --amneziawg-go "$GITHUB_WORKSPACE/out/amneziawg-go" \
            --uid "$uid"
          sudo "$GITHUB_WORKSPACE/scripts/install-daemon-control-poc.sh" status --uid "$uid"
          sudo "$GITHUB_WORKSPACE/scripts/install-daemon-control-poc.sh" uninstall --uid "$uid"
          trap - EXIT
          test ! -e /Library/LaunchDaemons/com.amneziawg.daemon-control.poc.plist
          test ! -e /usr/local/libexec/amneziawg-daemon-control-poc
          test ! -e /usr/local/libexec/amneziawg-go-daemon-control-poc
          test ! -e /private/var/run/amneziawg-daemon-control-poc
