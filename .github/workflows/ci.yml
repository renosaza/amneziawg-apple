name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    env:
      # Verified in WireGuard.xcodeproj: the signed app embeds its extension; the daemon target does not.
      MACOS_APP_TARGETS: WireGuardmacOS WireGuardmacOSDaemon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Sources/WireGuardKitGo/go.mod
          cache-dependency-path: Sources/WireGuardKitGo/go.sum
      - name: Prepare unsigned build configuration
        run: cp Sources/WireGuardApp/Config/Developer.xcconfig.template Sources/WireGuardApp/Config/Developer.xcconfig
      - name: Verify the selected macOS application targets
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project WireGuard.xcodeproj -json | tee /tmp/xcode-project.json
          for target in $MACOS_APP_TARGETS; do
            plutil -extract project.targets json -o - /tmp/xcode-project.json | grep -Fq "\"${target}\""
          done
      - name: Build Go bridge
        run: make -C Sources/WireGuardKitGo
      - name: Test the isolated daemon-control protocol POC
        run: go test -C scripts/daemon-control ./...
      - name: Test the read-only macOS daemon-control client
        run: scripts/test-daemon-control-client.sh
      - name: Test unsigned daemon GUI target boundaries
        run: scripts/test-unsigned-daemon-gui-target.sh
      - name: Compile macOS application targets without signing
        shell: bash
        run: |
          set -euo pipefail
          for target in $MACOS_APP_TARGETS; do
            xcodebuild -project WireGuard.xcodeproj -target "$target" -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          done
      - name: Run all SwiftPM WireGuardKit tests
        shell: bash
        run: |
          set -euo pipefail
          swift test list | tee /tmp/swiftpm-tests.txt
          grep -Fq 'ExcludeIPsTests/' /tmp/swiftpm-tests.txt
          grep -Fq 'DaemonProfileStoreTests/' /tmp/swiftpm-tests.txt
          grep -Fq 'RouteOwnershipValidatorTests/' /tmp/swiftpm-tests.txt
          grep -Fq 'NetworkChangeEndpointTests/' /tmp/swiftpm-tests.txt
          swift test
