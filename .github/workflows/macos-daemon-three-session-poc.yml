name: macOS three-session daemon POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: scripts/daemon-control/go.mod
          cache-dependency-path: scripts/daemon-control/go.sum
      - name: Diagnose the TEST-NET planned endpoint RIB on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sudo env AMNEZIAWG_DAEMON_RUNTIME=1 go test -C scripts/daemon-control -v -tags manualruntime -run TestManualPlannedEndpointRIBDiagnostic -count=1
